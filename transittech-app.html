<style>
:root{--brand-primary:#173F37;--brand-dark:#0D302A;--brand-accent:#FF641F;--bg-main:#F7F3E9;--bg-secondary:#ECEBE4;--surface:#FFFFFF;--green-pine:#244E43;--green-sage:#91A995;--green-mint:#C8DFD0;--green-jade:#32836C;--orange-coral:#F27C62;--orange-peach:#FFD0B5;--yellow-amber:#E5A52E;--yellow-butter:#F4DF9A;--blue-navy:#243B53;--blue-ocean:#326B8C;--blue-sky:#78B9D0;--blue-ice:#D9EEF2;--purple:#7762B3;--lavender:#A99BCB;--rose:#D77B86;--plum:#705477;--text-primary:#202925;--text-secondary:#77817B;--border:#E5E5DC;--white:#FFFFFF;--success:#38845F;--warning:#D99A35;--danger:#C94D45;--info:#477C9B;
--bg:var(--bg-main);--bg2:var(--bg-secondary);--sf:var(--surface);--tx:var(--text-primary);--t2:#5d6761;--ac:var(--brand-accent);--gr:var(--brand-primary);--bd:var(--border);--ok:var(--success);--wn:var(--warning);--dn:var(--danger);--m:'IBM Plex Mono',ui-monospace,monospace;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
:root[data-t=dark]{--bg:#0D302A;--bg2:#12382F;--sf:#173F37;--tx:#F7F3E9;--t2:#B7C6BD;--gr:#32836C;--bd:#2b5a4e;color-scheme:dark}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:400 15px/1.5 Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex}
a{color:inherit;text-decoration:none}button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mono{font-family:var(--m)}
nav.sb{width:224px;flex:none;border-right:1px solid var(--bd);padding:24px 16px;display:flex;flex-direction:column;gap:4px;height:calc(100vh - 60px);position:sticky;top:calc(60px + env(safe-area-inset-top,0px));overflow:auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;margin:0 8px 24px}
.logo i{background:var(--ac);color:#fff;width:28px;height:28px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-family:var(--m)}
nav a{display:flex;gap:12px;align-items:center;padding:8px 12px;border-radius:5px;color:var(--t2);font-weight:600;font-size:14px}
nav a:hover{background:var(--bg2)}nav a[aria-current]{background:var(--gr);color:#fff}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{flex:1;min-width:0;padding:48px clamp(16px,4vw,64px) 64px;max-width:1100px;margin:0 auto}
main>*{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}
h1{font-size:clamp(30px,5vw,52px);line-height:1.05;font-weight:800;letter-spacing:-.03em;margin-bottom:12px}
h2{font-size:20px;font-weight:800;margin:32px 0 12px;letter-spacing:-.01em}h3{font-size:16px;font-weight:800}
p.l{color:var(--t2);max-width:60ch}.s{color:var(--t2);font-size:13px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--sf);padding:8px 16px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}.btn.p{background:var(--ac);border-color:var(--ac);color:var(--brand-dark)}.btn.g{background:var(--gr);border-color:var(--gr);color:#fff}
.btn.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.plan{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:end;margin:24px 0;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:4px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px #ff641f33;outline:0}
.err{color:var(--dn);font-size:13px;margin-top:4px;font-weight:600;min-height:1px}
.chip{border:1px solid var(--bd);border-radius:5px;padding:4px 12px;background:var(--sf);cursor:pointer;font-size:13px;font-weight:600}
.bus{font-family:var(--m);font-weight:500;background:var(--gr);color:#fff;border-radius:5px;padding:2px 8px;font-size:13px;display:inline-block}
.bus.a{background:var(--ac);color:var(--brand-dark)}.tag{font-size:12px;font-weight:600;border:1px solid currentColor;border-radius:5px;padding:1px 8px;color:var(--ok)}
.opt{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:12px;transition:border-color .15s}.opt:hover{border-color:var(--gr)}.opt.rec{border:2px solid var(--ac)}
.big{font-family:var(--m);font-size:22px;font-weight:500}
.tl{position:relative;padding-left:32px;margin:16px 0}.tl:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:4px;background:var(--lc,var(--gr));border-radius:2px;transform-origin:top;animation:grow .6s ease-out}
@keyframes grow{from{transform:scaleY(0)}}
.st{position:relative;padding:6px 0}.st:before{content:"";position:absolute;left:-29px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--sf);border:3px solid var(--gr)}
.st.k:before{width:18px;height:18px;left:-33px;top:8px;background:var(--ac);border-color:var(--ac)}.st.x:before{border-radius:2px;border-color:var(--ac);width:14px;height:14px;left:-31px}
.walk{margin:8px 0;padding:8px 12px;border:1px dashed var(--t2);border-radius:7px;font-size:13px;color:var(--t2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:10px;overflow:hidden}.stats>div{background:var(--sf);padding:12px 16px}
.stats b{display:block;font-family:var(--m);font-size:20px;font-weight:500}
.sk{height:96px;border-radius:10px;margin-bottom:12px;background:linear-gradient(90deg,var(--bg2),var(--sf),var(--bg2));background-size:200% 100%;animation:sh 1s infinite}@keyframes sh{to{background-position:-200% 0}}
.hide{display:none!important}.list{display:flex;flex-direction:column;gap:8px}
details{border-bottom:1px solid var(--bd);padding:12px 0}summary{font-weight:700;cursor:pointer}details[open] p{animation:in .2s;margin-top:8px;color:var(--t2)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--bd)}
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:7px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}#toast.on{opacity:1}
svg.map{width:100%;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;touch-action:manipulation}
.empty{text-align:center;padding:48px 16px;border:1px dashed var(--bd);border-radius:10px;color:var(--t2)}
.bm.on svg{fill:var(--ac);stroke:var(--ac);animation:pop .3s}@keyframes pop{50%{transform:scale(1.4)}}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center;margin-bottom:24px}
.hl span{display:block;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}.hl span+span{animation-delay:.12s;color:var(--green-jade)}.hp{animation:rise .7s .25s both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.hero .plan{grid-template-columns:1fr auto 1fr}.hero .plan .p{grid-column:1/-1;justify-content:center}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.3s ease-out var(--d) forwards}@keyframes dr{to{stroke-dashoffset:0}}

P.about=()=>`<h1>Journeys, made legible.</h1><div style="max-width:62ch"><h2>Why TransitTech exists</h2><p>Buses carry most of a city's commuters, yet the network is hard to read when you are new to it or in a hurry.</p><h2>The commuter problem</h2><p>Which bus do I board? Where do I get off? Will I need to change, and what will it cost? Most people piece this together from memory and guesswork.</p><h2>Our approach</h2><p>TransitTech shows the whole journey in one view: boarding stop, every change, every stop in between.</p><h2>How journey planning works</h2><p>The planner finds routes serving your origin and destination, keeps direct matches, then pairs routes that share a real interchange stop. Duration and fare come from the stop count; results are ranked by time, transfers and cost.</p><h2>Design principles</h2><p>Clarity before decoration. Never use colour alone to carry meaning. Say plainly what is estimated.</p><h2>How next-bus times work</h2><p>TransitTech reads your device clock and looks up each route's sample timetable. Buses run more often at peak hours and less often off-peak, and Night Owl buses run overnight. If service has ended for the day, you see the first bus tomorrow.</p><h2>Prototype limitations</h2><p>TransitTech is a frontend prototype for the fictional city of Navapur. All routes, timetables and fares are predefined samples. It does not connect to live transit systems or show real-time vehicle positions.</p></div>`;
